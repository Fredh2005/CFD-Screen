name: Build the CFD screen

# Rebuilds the page on fresh daily bars four times each weekday - after the
# London open, after the US open, at the London close and after the US close -
# and on every push to main. GitHub's scheduler is best-effort and often late;
# for a few-day hold that costs a stale hour, not a wrong trade.
on:
  schedule:
    - cron: "20 7 * * 1-5"    # 08:20 UK in BST / 07:20 in GMT
    - cron: "50 13 * * 1-5"   # 14:50 UK in BST - twenty minutes after the US open
    - cron: "45 15 * * 1-5"   # 16:45 UK in BST - after the LSE close
    - cron: "20 20 * * 1-5"   # 21:20 UK in BST - after the US close
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Show what actually got installed
        run: |
          python -c "import sys, pandas, yfinance; print('python', sys.version.split()[0]); print('pandas', pandas.__version__); print('yfinance', yfinance.__version__)"
          python -c "from zoneinfo import ZoneInfo; from datetime import datetime; print('London time:', datetime.now(ZoneInfo('Europe/London')))"

      - name: Build the screen
        run: python -W ignore build.py

      - name: Fail if the build came back thin
        run: |
          BYTES=$(wc -c < site/data.js)
          echo "site/data.js is $BYTES bytes"
          if [ "$BYTES" -lt 60000 ]; then
            echo "::error::site/data.js is only $BYTES bytes - not publishing."
            exit 1
          fi
          grep -q '"ind"' site/data.js || { echo "::error::site/data.js carries no indicators"; exit 1; }
          for f in index.html manifest.webmanifest sw.js icon-192.png apple-touch-icon.png; do
            [ -s "site/$f" ] || { echo "::error::site/$f missing or empty"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
